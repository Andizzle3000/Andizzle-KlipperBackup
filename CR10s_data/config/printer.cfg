# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.
[include mainsail.cfg]
[include chroma_head.cfg]
[include kcm.cfg]
[include cp_macro.cfg]
[include ecm_1.cfg]
#[include adxl.cfg]
#[include external_inputshaper.cfg]
[include Line_Purge.cfg]
[include KAMP_Settings.cfg]
[include input_shaper.cfg]
[include sensorless.cfg]
[include zboard.cfg]
[include Macros.cfg]

[exclude_object]

[skew_correction]

[force_move]
enable_force_move: True

[virtual_sdcard]
path: /home/user/CR10s_data/gcodes
on_error_gcode: CANCEL_PRINT

# Enable arcs support
[gcode_arcs]
resolution: 0.1

[delayed_gcode startup]
initial_duration: 5 
gcode:
  T0
  #SET_VELOCITY_LIMIT VELOCITY=300
  #SET_VELOCITY_LIMIT ACCEL=4000

[idle_timeout]
timeout: 600

gcode:
  {% if printer.pause_resume.is_paused %}
  M117 Idle but paused, maintaining bed temp.
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
  {% else %}
  TURN_OFF_HEATERS
  M84
  {% endif %}

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3F001B000F504B5735313920-if00

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 15000
max_z_velocity: 10
max_z_accel: 100

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 64
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 286
position_min: -4
position_max: 286
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 1.2
hold_current: 0.9
diag_pin: ^PC0
driver_SGTHRS: 120 # 255 is most sensitive value, 0 is least sensitive
interpolate: False
#stealthchop_threshold: 999999 

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 64
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -24
position_endstop: 360
position_max: 360
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.2
hold_current: 0.9
#stealthchop_threshold: 999999
diag_pin: ^PC1
driver_SGTHRS: 120 # 255 is most sensitive value, 0 is least sensitive
interpolate: False

