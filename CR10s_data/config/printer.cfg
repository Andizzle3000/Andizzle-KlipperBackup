[extruder]
max_extrude_only_distance: 300.0
max_extrude_cross_section:10
full_steps_per_rotation: 200
step_pin: cp_Head:PA9
dir_pin: !cp_Head:PA8
enable_pin: !cp_Head:PA10
#stepx
microsteps: 16
rotation_distance:  4.55287810496
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: cp_Head:PA2
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: cp_Head:PA1
#control: pid
#pid_Kp:41.325
#pid_Ki:1.887
#pid_Kd:226.252
min_temp: -100
max_temp: 300
min_extrude_temp: 20
pressure_advance:0.0375
pressure_advance_smooth_time: 0.040

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp = 73.094
pid_ki = 0.894
pid_kd = 1493.857
min_temp: 0
max_temp: 90

[controller_fan mcu_fan_1]
pin: PC7

[controller_fan mcu_fan]
pin: PC6

[input_shaper]
shaper_freq_x: 40.4
shaper_type_x: ei
shaper_freq_y: 46
shaper_type_y: mzv

#[filament_switch_sensor fil_runout_sensor]
#pause_on_runout: True
#runout_gcode: PAUSE
#switch_pin: !PC15

#[bltouch]
#sensor_pin: ^PC2
#control_pin: PA1
#x_offset: -49.2
#y_offset: -8
#z_offset: 0
#speed:
#samples: 1

[probe]
pin: cp_Head:PA3

x_offset: 33
y_offset: -1.5

speed: 180
lift_speed: 10.0
#z_offset: 0

[bed_mesh]
probe_count = 10,10
algorithm = bicubic
speed: 175
horizontal_move_z: 10
mesh_min: 33,5
mesh_max: 295, 305
fade_start: 1.0
fade_end: 10.0

#[safe_z_home]
#home_xy_position: 115,159 # Change coordinates to the center of your print bed
#speed: 50
#z_hop: 10                 # Move up 10mm
#z_hop_speed: 5

[temperature_sensor Laptop]
sensor_type: temperature_host

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
sensor_temperature1: 25
sensor_adc1: 0.210317
#min_temp: 0
#max_temp: 105

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1

[screws_tilt_adjust]
screw_thread: CW-M3
speed: 100
screw1: 240, 280
screw1_name: right back screw
screw2: 240, 39
screw2_name: right front screw
screw3: 0, 39
screw3_name: left front screw
screw4: 0, 280
screw4_name: left back screw

