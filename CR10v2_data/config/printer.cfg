# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.
[include mainsail.cfg]
#[include adxl.cfg]
#[include external_inputshaper.cfg]
[include Line_Purge.cfg]
[include KAMP_Settings.cfg]
[include sensorless.cfg]
[include zboard.cfg]
[include macros.cfg]

[exclude_object]

[skew_correction]

[force_move]
enable_force_move: True

[virtual_sdcard]
path: /home/user/CR10v2_data/gcodes
on_error_gcode: CANCEL_PRINT

# Enable arcs support
[gcode_arcs]
resolution: 0.1

[idle_timeout]
timeout: 600

gcode:
  {% if printer.pause_resume.is_paused %}
  M117 Idle but paused, maintaining bed temp.
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
  {% else %}
  TURN_OFF_HEATERS
  M84
  {% endif %}

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_2000480002504B5735313920-if00

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 15000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 64
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 322
position_min: -8
position_max: 322
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 1.2
hold_current: 0.9
diag_pin: ^PC0
driver_SGTHRS: 100 # 255 is most sensitive value, 0 is least sensitive
interpolate: False
#stealthchop_threshold: 999999 

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 64
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -10
position_endstop: 338
position_max: 338
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.2
hold_current: 0.9
#stealthchop_threshold: 999999
diag_pin: ^PC1
driver_SGTHRS: 100 # 255 is most sensitive value, 0 is least sensitive
interpolate: False

#[stepper_z]
#step_pin: PB0
#dir_pin: !PC5
#enable_pin: !PB1
#microsteps: 16
#rotation_distance: 8
#endstop_pin: PC2
#position_endstop: 0
#position_min:-3
#position_max: 250

#[tmc2209 stepper_z]
#uart_pin: PC11
#tx_pin: PC10
#uart_address: 1
#run_current: 0.580
#stealthchop_threshold: 999999

[extruder]
max_extrude_only_distance: 300.0
max_extrude_cross_section:10
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance:  7.668936
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: -100
max_temp: 260
min_extrude_temp: 180
pressure_advance:0.0594
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650

[heater_bed]
heater_pin: zboard:PA5 #ar8
sensor_type: ATC Semitec 104GT-2
sensor_pin: zboard:PC0 #analog14
#control: pid
#Stock PID configuration taken from Marlin
#pid_Kp: 201.86
#pid_Ki: 10.67
#pid_Kd: 954.96
min_temp: 0
max_temp: 100

#[heater_bed]
#heater_pin: PC9
#sensor_type: EPCOS 100K B57560G104F
#sensor_pin: PC4
#control: pid
#pid_kp = 73.094
#pid_ki = 0.894
#pid_kd = 1493.857
#min_temp: 0
#max_temp: 100

[heater_fan hotend_fan]
pin: PB15

[fan]
pin: PC6

[controller_fan mcu_fan_1]
pin: PC7
fan_speed: 0.5

[controller_fan mcu_fan_2]
pin: zboard: PA7
#sensor_type: temperature_mcu
#control: watermark
#target_temp: 50
#min_temp: 20
#max_temp:85
fan_speed: 0.5

[controller_fan mcu_fan_3]
pin: zboard: PB0
fan_speed: 0.5

[input_shaper]
shaper_freq_x: 56
shaper_type_x: ei
shaper_freq_y: 39
shaper_type_y: mzv

#[filament_switch_sensor fil_runout_sensor]
#pause_on_runout: True
#runout_gcode: PAUSE
#switch_pin: zboard:PB4

[probe]
pin: zboard:PA8
# NOTE: Set this to a value based on your printer and bed.
#z_offset: 0
x_offset: -28.5
y_offset: 22

#[bltouch]
#sensor_pin: ^PC14
#control_pin: PA1
#x_offset: 0
#y_offset:-59.4
#z_offset:3.0

[bed_mesh]
probe_count = 10,10
algorithm = bicubic
speed: 175
horizontal_move_z: 10
mesh_min: 15,12 #bl touch 10,0
mesh_max: 290,295 #bl touch 300, 255
fade_start: 1.0
fade_end: 10.0

#[safe_z_home]
#home_xy_position: 115,159 # Change coordinates to the center of your print bed
#speed: 50
#z_hop: 10                 # Move up 10mm
#z_hop_speed: 5

[temperature_sensor Laptop]
sensor_type: temperature_host

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
sensor_temperature1: 25
sensor_adc1: 0.210317
min_temp: 0
max_temp: 105


[screws_tilt_adjust]
screw_thread: CW-M4
horizontal_move_z: 10
speed: 100
screw1: 306,253 #blt277, 313
screw1_name: right back screw
screw2: 306,12 #blt277, 74
screw2_name: right front screw
screw3: 65,12 #blt36, 74
screw3_name: left front screw
screw4: 65,253 #blt36, 313
screw4_name: left back screw

