[include mainsail.cfg]

[virtual_sdcard]
path: /home/user/Ender3S1_data/gcodes
on_error_gcode: CANCEL_PRINT

#[include adxl.cfg]
#[include Adaptive_Meshing.cfg]
[include Line_Purge.cfg]
[include KAMP_Settings.cfg]
[include Macros.cfg]
[include Eddy.cfg]

[exclude_object]

[input_shaper]
shaper_freq_x: 43
shaper_type_x: mzv
shaper_freq_y: 83
shaper_type_y: mzv

[idle_timeout]
timeout: 600

gcode:
  {% if printer.pause_resume.is_paused %}
  M117 Idle but paused, maintaining bed temp.
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
  {% else %}
  TURN_OFF_HEATERS
  M84
  {% endif %}
  
[skew_correction] 


[firmware_retraction]
retract_length: 0.3
retract_speed: 65
#unretract_extra_length: 0
unretract_speed: 45


[gcode_arcs]
resolution: 0.1
  
[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: 0
position_max: 248
position_min: 0
homing_speed: 50

[stepper_y]
step_pin: PB8  
dir_pin: PB7
enable_pin: !PC3 
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_endstop: 0
position_max: 222
position_min: 0
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 271
position_min: -4

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
gear_ratio: 42:12
rotation_distance: 26.219245
nozzle_diameter: 0.6
filament_diameter: 1.750
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PC5
#control: pid
#pid_Kp: 23.561
#pid_Ki: 1.208
#pid_Kd: 114.859
min_temp: 0
max_temp: 305 # Set to 300 for S1 Pro
max_extrude_only_distance: 120
pressure_advance: 0.029
max_extrude_cross_section: 5

[heater_bed]
heater_pin: PA7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 71.867
pid_Ki: 1.536
pid_Kd: 840.843
min_temp: 0
max_temp: 103 # Set to 110 for S1 Pro

[heater_fan hotend_fan]
pin: PC0
fan_speed : 0.8

[fan]
pin: PA0
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.10

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor Laptop]
sensor_type: temperature_host

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 6000 #4500 
max_z_velocity: 30
max_z_accel: 100





[filament_switch_sensor e0_sensor]
switch_pin: !PC15
pause_on_runout: true
runout_gcode: PAUSE

[pause_resume]
recover_velocity: 150

[screws_tilt_adjust]
screw1: 70, 26
screw1_name: front left screw
screw2: 245, 26
screw2_name: front right screw
screw3: 245, 197
screw3_name: rear right screw
screw4: 70, 197
screw4_name: rear left screw
horizontal_move_z: 10.
speed: 50.
screw_thread: CW-M3

[bed_screws]
screw1: 21.5, 25
screw2: 196.5, 25
screw3: 196.5, 196
screw4: 21.5, 196

