[include mainsail.cfg]
#[include adxl.cfg]
#[include Adaptive_Meshing.cfg]
[include Line_Purge.cfg]
[include KAMP_Settings.cfg]
[include chroma_head.cfg]
[include kcm.cfg]
#[include bed_mesh.cfg]
[include cp_macro.cfg]
#[include input_shaper.cfg]
[include Eddy.cfg]
#[include external_inputshaper.cfg]
#[include ecm_1.cfg]

[virtual_sdcard]

path: /home/user/Neptune3Max_data/gcodes
on_error_gcode: CANCEL_PRINT

[exclude_object] 

[pause_resume]

[display_status]

[delayed_gcode startup]
initial_duration: 5 
gcode:
  T0
  
[firmware_retraction]
retract_length: 1
retract_speed: 25
unretract_extra_length: .2
unretract_speed: 25

[skew_correction] 

[gcode_macro MANUAL_LEVEL]
description: Home and measure for maunual leveling adjustments
gcode:
  G28
  SCREWS_TILT_CALCULATE
  G90
  G1 F3000 X213 Y213 Z25 

[idle_timeout]
timeout: 600

gcode:
  {% if printer.pause_resume.is_paused %}
  M117 Idle but paused, maintaining bed temp.
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
  {% else %}
  TURN_OFF_HEATERS
  M84
  {% endif %}

# Enable arcs support
[gcode_arcs]
resolution: 0.1

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[led LED_Light]
white_pin: PB9
initial_white: 1.0

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5
# Use those higher values just to configure Input Shaper 
#max_accel: 10000
#max_accel_to_decel: 10000

[stepper_x]
step_pin: !PC12
dir_pin: PB3
enable_pin: !PD2
microsteps: 16
rotation_distance: 40
endstop_pin: PA13
position_endstop: -17
position_min: -17
position_max: 410
homing_speed: 50

[stepper_y]
step_pin: PC11
dir_pin: PA15
enable_pin: !PC10
microsteps: 16
rotation_distance: 40
endstop_pin: PB8
position_endstop: -6
position_min: -6
position_max: 430
homing_speed: 50

[stepper_z]
step_pin: PC7
dir_pin: !PC9
enable_pin: !PC8
rotation_distance: 8
microsteps: 16
position_min: -2
position_max: 506
endstop_pin: probe:z_virtual_endstop 
homing_speed: 5
homing_retract_speed: 15

[extruder]
max_extrude_only_distance: 300.0
max_extrude_cross_section:10
full_steps_per_rotation: 200
step_pin: cp_Head:PA9
dir_pin: !cp_Head:PA8
enable_pin: !cp_Head:PA10
#stepx
microsteps: 16
rotation_distance:  4.49779374
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: cp_Head:PA2
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: cp_Head:PA1
control: pid
pid_Kp:16.84 
pid_Ki:0.960
pid_Kd:73.911
min_temp: -100
max_temp: 300
min_extrude_temp: 20

pressure_advance:0.068
pressure_advance_smooth_time: 0.040

#[extruder]
#max_extrude_only_distance: 101.0
#step_pin: PB10
#dir_pin: PB1
#enable_pin: !PC6
#microsteps: 16
#nozzle_diameter: 0.400
#filament_diameter: 1.750
#heater_pin: PA6
#sensor_type: EPCOS 100K B57560G104F
#sensor_pin: PC1
#min_temp: 0
#max_temp: 250
#rotation_distance: 7.7265
#max_extrude_cross_section: 5
#pressure_advance = 0.0925

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
pwm_cycle_time: 0.020 
max_temp: 110
min_temp: 0

[controller_fan mcu_fan]
pin: PB0
max_power: 1.0
shutdown_speed: 1.0
fan_speed: 1.0

#[fan]
#pin: PA7

[force_move]
enable_force_move: True

[safe_z_home]
speed: 100.0
home_xy_position: 222.699, 189.411
z_hop: 10

#[probe]
#pin: ^PA8
#speed: 5
#lift_speed: 15
#samples: 1
#x_offset: -28.5
#y_offset: 22

#[filament_switch_sensor filament_sensor]
#pause_on_runout: true
#switch_pin: PB4

#[bed_mesh]
#probe_count = 10,10
#algorithm = bicubic
#speed: 200
#horizontal_move_z: 10
#mesh_min: 33, 16
#mesh_max: 397, 415
#fade_start: 1.0
#fade_end: 10.0

[input_shaper]
shaper_type_x = mzv
shaper_freq_x = 47
shaper_type_y = mzv
shaper_freq_y = 37

[temperature_sensor Laptop]
sensor_type: temperature_host

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
sensor_temperature1: 25
sensor_adc1: 0.210317
#min_temp: 0
#max_temp: 105
  
[screws_tilt_adjust]
screw_thread: CW-M3
speed: 200
screw1: 243.5, 193
screw1_name: center
screw2: 406, 370.5
screw2_name: right back screw
screw3: 406, 193
screw3_name: right middle screw
screw4: 406, 15.5
screw4_name: right front screw
screw5: 52, 15.5
screw5_name: left front screw
screw6: 52, 193
screw6_name: left middle screw
screw7: 52, 370.5
screw7_name: left back screw

